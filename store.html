<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sandpull Store: forms, faces, and chimes</title>
  <meta name="description" content="The free hourglass keeps time. Unlock a different body, menu bar face, and expiry chime for the icon you live with.">
  <meta property="og:title" content="Sandpull Store">
  <meta property="og:description" content="Forms, faces, and chimes for the menu bar hourglass.">
  <meta property="og:image" content="assets/app-icon.png">
  <link rel="icon" href="assets/app-icon-256.png" type="image/png" sizes="256x256">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/app-icon-256.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="is-store">
  <header class="nav">
    <a class="brand" href="index.html">
      <img src="assets/app-icon-256.png" width="36" height="36" alt="">
      <span>Sandpull</span>
    </a>
    <nav>
      <a href="index.html">Home</a>
      <a class="keep" href="guide.html">Guide</a>
      <a class="keep" href="store.html" aria-current="page">Store</a>
      <a href="downloads/Sandpull.dmg" class="nav-cta" download>Download</a>
    </nav>
  </header>

  <main class="store-desk">
    <div class="store-preview" id="storePreview" data-face="both" data-form="classic">
      <div class="desktop">
        <div class="menubar">
          <span class="apple" aria-hidden="true"></span>
          <span class="mb-app">Finder</span>
          <span class="mb-spacer"></span>
          <span class="status-icon" id="storeFace">
            <span class="face-ring" aria-hidden="true"></span>
            <span class="face-glass" id="storeIconGlass"></span>
            <span class="status-time">24:12</span>
          </span>
          <span class="mb-spacer"></span>
          <span class="mb-clock">16:39</span>
        </div>
        <div class="store-canvas">
          <div class="store-dim" aria-hidden="true"></div>
          <div class="store-line"></div>
          <div class="store-glass" id="storeBigGlass"></div>
          <div class="store-bubble">
            <strong>25 min</strong>
            <span>17:04</span>
          </div>
        </div>
      </div>
    </div>

    <aside class="store-panel">
      <p class="eyebrow">Store</p>
      <h1 id="lookName">Starter</h1>
      <p class="look-price" id="storeTotal">The free glass. Included.</p>
      <p class="fine" id="orderDone" hidden></p>

      <div class="presets" id="presets"></div>

      <fieldset>
        <legend>Form</legend>
        <div class="pills" id="formChoices"></div>
      </fieldset>
      <fieldset>
        <legend>Face</legend>
        <div class="pills" id="faceChoices"></div>
      </fieldset>
      <fieldset>
        <legend>Chime</legend>
        <div class="pills" id="chimeChoices"></div>
      </fieldset>

      <div class="store-buy">
        <button type="button" class="btn-save" id="addLook">Keep this · $5</button>
        <button type="button" class="btn-quiet" id="addStudio">Atelier $11</button>
      </div>

      <div class="store-cart" id="cart" hidden>
        <ul id="cartRows"></ul>
        <p class="store-total" id="cartTotal"></p>
        <button type="button" class="btn-save" id="openCheckout">Checkout</button>
      </div>
    </aside>
  </main>

  <dialog class="checkout" id="checkout">
    <form id="checkoutForm" method="dialog">
      <p class="eyebrow">Checkout</p>
      <h2 id="checkoutTitle">Keep this on your Mac</h2>
      <p class="fine" id="checkoutSummary"></p>
      <label>Name <input id="orderName" name="name" type="text" required autocomplete="name"></label>
      <label>Email <input id="orderEmail" name="email" type="email" required autocomplete="email"></label>
      <p class="fine">Card payments open after Sandpull is notarized. This saves your order.</p>
      <div class="hero-actions">
        <button type="submit" class="btn-save" id="placeOrder">Place order</button>
        <button type="button" class="btn-quiet" id="closeCheckout">Cancel</button>
      </div>
    </form>
  </dialog>

  <script src="store.js"></script>
</body>
</html>
