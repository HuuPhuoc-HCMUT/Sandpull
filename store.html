<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sandpull Looks</title>
  <meta name="description" content="Free looks for Sandpull. Pick a form, face, and chime, then apply them in the Mac app.">
  <link rel="icon" href="assets/app-icon-256.png" type="image/png" sizes="256x256">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="is-store">
  <header class="nav">
    <a class="brand" href="index.html">
      <img src="assets/app-icon-256.png" width="36" height="36" alt="">
      <span>Sandpull</span>
    </a>
    <nav>
      <a href="index.html">Home</a>
      <a class="keep" href="guide.html">Guide</a>
      <a class="keep" href="store.html" aria-current="page">Looks</a>
      <a href="downloads/Sandpull.dmg" class="nav-cta" download>Download</a>
    </nav>
  </header>

  <main class="store-desk">
    <div class="store-preview" id="storePreview" data-face="both" data-form="classic">
      <div class="desktop">
        <div class="menubar">
          <span class="apple" aria-hidden="true"></span>
          <span class="mb-app">Finder</span>
          <span class="mb-spacer"></span>
          <span class="status-icon" id="storeFace">
            <span class="face-ring" aria-hidden="true"></span>
            <span class="face-glass" id="storeIconGlass"></span>
            <span class="status-time">24:12</span>
          </span>
          <span class="mb-spacer"></span>
          <span class="mb-clock">16:39</span>
        </div>
        <div class="store-canvas">
          <div class="store-dim" aria-hidden="true"></div>
          <div class="store-line"></div>
          <div class="store-glass" id="storeBigGlass"></div>
          <div class="store-bubble">
            <strong>25 min</strong>
            <span>17:04</span>
          </div>
        </div>
      </div>
    </div>

    <aside class="store-panel">
      <p class="eyebrow">Looks · Free</p>
      <h1 id="lookName">Starter</h1>
      <p class="look-price">Copy the code, then paste it at the bottom of Settings. It restyles the hourglass, the list, and the Save window.</p>

      <div class="presets" id="presets"></div>

      <div class="look-row">
        <span>Form</span>
        <div class="pills" id="formChoices"></div>
      </div>
      <div class="look-row">
        <span>Face</span>
        <div class="pills" id="faceChoices"></div>
      </div>
      <div class="look-row">
        <span>Chime</span>
        <div class="pills" id="chimeChoices"></div>
      </div>

      <div class="store-buy">
        <code class="look-code" id="lookCode">sp-classic-both-hush</code>
        <button type="button" class="btn-save" id="copyCode">Copy code</button>
      </div>
      <p class="fine" id="copyDone" hidden>Copied. Paste it in Settings.</p>
    </aside>
  </main>

  <script src="store.js"></script>
</body>
</html>
